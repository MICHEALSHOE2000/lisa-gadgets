name: Copy source repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror source into this repository
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --mirror https://github.com/MICHEALSHOE2000/nedus-gadget.git source.git
          cd source.git
          git remote add target "https://x-access-token:${TARGET_TOKEN}@github.com/${TARGET_REPOSITORY}.git"
          git push --mirror target
